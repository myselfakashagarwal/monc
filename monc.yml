version: '3.7'
services:
  export-metrics:
    image: "prom/node-exporter:v1.3.1"
    container_name: "export-metrics-container"
    network_mode: "host" 
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host/rootfs:ro"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/rootfs"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|etc)($$|/)"
    restart: "always"
    profiles:
      - "export-metrics"
      - "export"
      - "metrics"
      - "monc"

  export-logs:
    image: "grafana/promtail:v2.8.0"
    container_name: "export-logs-container"
    environment:
      - "LOKI_IP=${LOKI_IP}"
      - "PROMTAIL_CONFIG=${PROMTAIL_CONFIG}"
    network_mode: "host"
    extra_hosts:
      - "loki:${LOKI_IP}"
    volumes:
      - "/var/log:/host/var/log:ro"
      - "/tmp:/tmp:rw"
      - "${PROMTAIL_CONFIG}:/etc/promtail/promtail.yml"
    command:
      - "--config.file=/etc/promtail/promtail.yml"
    restart: "always"
    profiles:
      - "export-logs"
      - "export"
      - "logs"
      - "monc"

  store-metrics:
    image: "prom/prometheus:v2.41.0"
    container_name: "store-metrics-container"
    environment:
      - "EXPORTER_IP=${EXPORTER_IP}"
      - "PROMETHEUS_CONFIG=${PROMETHEUS_CONFIG}"
    ports:
      - "9090:9090"
    expose:
      - "9090"
    volumes:
      - "${PROMETHEUS_CONFIG}:/etc/prometheus/prometheus.yml"
      - "stored-metrics:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: "always"
    profiles:
      - "store-metrics"
      - "store"
      - "metrics"
      - "monc"
  
  store-logs:
    image: "grafana/loki:2.8.0"
    container_name: "store-logs-container"
    environment:
      - "LOKI_CONFIG=${LOKI_CONFIG}"
      - "PROMTAIL_IP=${PROMTAIL_IP}"
    ports:
      - "3100:3100"
    expose:
      - "3100"
    volumes:
      - "stored-logs:/tmp/loki:rw"
      - "${LOKI_CONFIG}:/etc/loki/loki.yml"
    command:
      - "--config.file=/etc/loki/loki.yml"
    restart: "always"
    profiles:
      - "store-logs"
      - "store"
      - "logs"
      - "monc"

volumes:
  stored-metrics:
  stored-logs:

